name: Build Uno Calculator EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x

    - name: List files
      run: dir src\Calculator.Skia.Gtk

    - name: Restore (Skia.Gtk project)
      run: dotnet restore ./src/Calculator.Skia.Gtk/Calculator.Skia.Gtk.csproj

    - name: Publish EXE (Skia desktop)
      run: dotnet publish ./src/Calculator.Skia.Gtk/Calculator.Skia.Gtk.csproj -c Release -f net9.0 -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnoCalculatorEXE
        path: src/Calculator.Skia.Gtk/bin/Release/net9.0/win-x64/publish/
