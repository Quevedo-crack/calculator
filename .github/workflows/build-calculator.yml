name: Build WPF Calculator (Desktop Static)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Instalar Windows SDK 10.0.19041.0 para aplicaciones de escritorio
    - name: Install Windows 10 SDK 19041 (Desktop)
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
      with:
        sdk-version: 19041
        desktop: true   # <-- importante para que instale la versión para Desktop

    # Compilar CalcManager (DLL nativa con runtime estático)
    - name: Build CalcManager (C++)
      run: msbuild src/CalcManager/CalcManager.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.19041.0 /p:LanguageStandard=stdcpp17

    # Restaurar dependencias del WPF
    - name: Restore dependencies
      run: dotnet restore src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj

    # Publicar el WPF como ejecutable autocontenido (un solo archivo .exe)
    - name: Publish WPF Calculator
      run: dotnet publish src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

    # Copiar la DLL nativa a la carpeta de publicación
    - name: Copy native DLL
      run: Copy-Item "src/CalcManager/x64/Release/CalcManager/CalcManager.dll" -Destination "publish/CalcManager.dll" -Force

    # Subir artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnoCalculator-WPF
        path: publish
