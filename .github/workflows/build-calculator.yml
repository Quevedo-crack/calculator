name: Build Calculator WPF with C++

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Descargar el repo
    - name: Checkout repo
      uses: actions/checkout@v4

    # 2. Instalar .NET 9
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # 3. Instalar MSBuild (para compilar C++)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Compilar CalcManager (C++)
    - name: Build CalcManager (C++)
      run: msbuild src/CalcManager/CalcManager.vcxproj /p:Configuration=Release /p:Platform=x64

    # 5. Restaurar dependencias del WPF
    - name: Restore dependencies
      run: dotnet restore src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj

    # 6. Compilar y publicar el WPF
    - name: Build WPF Calculator
      run: dotnet publish src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj -c Release -r win-x64 --self-contained true -o publish

    # 7. Subir el artifact con el .exe y la DLL
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-WPF
        path: |
          publish
          src/CalcManager/x64/Release/CalcManager.dll
