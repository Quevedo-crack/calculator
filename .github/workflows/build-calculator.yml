name: Build Uno Calculator WPF with C++

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 1. Compilar CalcManager (C++) - genera la DLL nativa
    - name: Build CalcManager (C++)
      run: msbuild src/CalcManager/CalcManager.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.19041.0 /p:LanguageStandard=stdcpp17

    # 2. Restaurar dependencias del WPF
    - name: Restore dependencies
      run: dotnet restore src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj

    # 3. Publicar el WPF como ejecutable autocontenido (un solo archivo .exe)
    - name: Publish WPF Calculator
      run: dotnet publish src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

    # 4. Copiar la DLL nativa (CalcManager.dll) a la carpeta de publicación
    - name: Copy native CalcManager.dll
      run: |
        Copy-Item "src/CalcManager/x64/Release/CalcManager/CalcManager.dll" -Destination "publish/CalcManager.dll" -Force

    # 5. Subir artifact (carpeta con el .exe y la DLL)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnoCalculator-WPF
        path: publish
