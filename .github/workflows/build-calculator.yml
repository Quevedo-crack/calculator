name: Build Calculator WPF with C++

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Compilar CalcManager (C++) usando el SDK retargeteado y toolset v143
    - name: Build CalcManager (C++)
      run: msbuild src/CalcManager/CalcManager.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Restore dependencies
      run: dotnet restore src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj

    - name: Build WPF Calculator
      run: dotnet publish src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj -c Release -r win-x64 --self-contained true -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-WPF
        path: |
          publish
          src/CalcManager/x64/Release/CalcManager.dll
