name: Build Uno Calculator (Skia.Gtk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Instalar herramientas de C++ (necesarias para CalcManager)
      - name: Install C++ Build Tools
        run: |
          choco install visualstudio2022buildtools --yes --no-progress
          choco install visualstudio2022-workload-vctools --yes --no-progress

      # Compilar la DLL nativa y dejarla en una carpeta conocida
      - name: Build CalcManager (Native)
        run: |
          msbuild src/CalcManager.Win32/CalcManager.Win32.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:OutDir=${{ github.workspace }}\artifacts\CalcManager\

      # Diagnóstico: listar todo lo generado en CalcManager
      - name: Diagnose native build output
        run: Get-ChildItem -Recurse ${{ github.workspace }}\artifacts\CalcManager

      # Copiar la DLL si existe, o mostrar todo lo generado si no
      - name: Copy native DLL to publish
        run: |
          $dll = Get-ChildItem -Recurse -File src\CalcManager.Win32 | Where-Object { $_.Name -eq "CalcManager.dll" }
          if ($dll) {
            Write-Host "✅ DLL encontrado en $($dll.FullName)"
            Copy-Item $dll.FullName "${{ github.workspace }}\publish\" -Force
          } else {
            Write-Warning "⚠️ No se generó CalcManager.dll. Se encontraron estos archivos en CalcManager.Win32:"
            Get-ChildItem -Recurse -File src\CalcManager.Win32
          }

      # Publicar la app Skia.Gtk (carpeta completa)
      - name: Publish Calculator.Skia.Gtk
        run: |
          dotnet publish src/Calculator.Skia.Gtk/Calculator.Skia.Gtk.csproj `
            -c Release `
            -f net9.0 `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o ${{ github.workspace }}\publish

      # Listar el contenido para verificar
      - name: List publish folder
        run: Get-ChildItem -Recurse ${{ github.workspace }}\publish

      # Subir el artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnoCalculator-Skia
          path: ${{ github.workspace }}\publish
