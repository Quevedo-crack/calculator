name: Build Uno Calculator WPF with C++

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 1. Compilar CalcManager (C++)
    - name: Build CalcManager (C++)
      run: msbuild src/CalcManager/CalcManager.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.19041.0

    # 2. Compilar CalcManagerWrapper (C++/CLI)
    - name: Build CalcManagerWrapper (C++/CLI)
      run: msbuild src/CalcManagerWrapper/CalcManagerWrapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.19041.0

    # 3. Restaurar dependencias del WPF
    - name: Restore dependencies
      run: dotnet restore src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj

    # 4. Compilar y publicar el WPF
    - name: Build WPF Calculator
      run: dotnet publish src/Calculator.Skia.WPF/Calculator.Skia.WPF.csproj -c Release -r win-x64 --self-contained true -o publish

    # 5. Subir artifact con exe + DLLs
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnoCalculator
        path: |
          publish
          src/CalcManager/x64/Release/CalcManager.dll
          src/CalcManagerWrapper/x64/Release/CalcManagerWrapper.dll
