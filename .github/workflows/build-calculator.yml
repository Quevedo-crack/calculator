name: Build Uno Calculator Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Install C++ Build Tools
      run: |
        choco install visualstudio2022buildtools --yes --ignore-checksums --force
        choco install visualstudio2022-workload-vctools --yes --ignore-checksums --force

    - name: Build CalcManager.Win32 (DLL)
      run: msbuild ./src/CalcManager.Win32/CalcManager.Win32.vcxproj /p:Configuration=Release /p:Platform=x64

    - name: List CalcManager build output
      run: Get-ChildItem "src\CalcManager.Win32\x64\Release"

    - name: Restore Calculator.Skia.Gtk
      run: dotnet restore ./src/Calculator.Skia.Gtk/Calculator.Skia.Gtk.csproj

    - name: Publish Calculator.Skia.Gtk (full folder)
      run: dotnet publish ./src/Calculator.Skia.Gtk/Calculator.Skia.Gtk.csproj -c Release -f net9.0 -r win-x64 -p:SelfContained=true -p:PublishSingleFile=false

    - name: Copy CalcManager DLL to publish folder
      run: |
        if (Test-Path "src\CalcManager.Win32\x64\Release\CalcManager.dll") {
          Copy-Item "src\CalcManager.Win32\x64\Release\CalcManager.dll" "src\Calculator.Skia.Gtk\bin\Release\net9.0\win-x64\publish\"
        } else {
          Write-Error "ERROR: CalcManager.dll no se generó. Revisa el log de MSBuild."
          Get-ChildItem "src\CalcManager.Win32\x64\Release"
          exit 1
        }

    - name: List publish folder
      run: Get-ChildItem "src\Calculator.Skia.Gtk\bin\Release\net9.0\win-x64\publish"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnoCalculatorFull
        path: src/Calculator.Skia.Gtk/bin/Release/net9.0/win-x64/publish/
